<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Match Cards · Live Fixtures</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: #000000;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      color: #ffffff;
      padding: 2.5rem 0 8rem; /* bottom space for sticky 728x90 ad */
    }

    /* ============================================================
       MAIN CONTENT AREA — centers content between side ads
       ============================================================ */
    .page-wrap {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 1.5rem;
      max-width: 1600px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    /* ============================================================
       LEFT STICKY AD (160x600)
       ============================================================ */
    .ad-left {
      flex-shrink: 0;
      width: 160px;
      position: sticky;
      top: 1.5rem;
      align-self: flex-start;
      z-index: 5;
    }

    .ad-left .ad-box {
      width: 160px;
      height: 600px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 0.6rem;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ============================================================
       CENTER — match cards
       ============================================================ */
    .center-col {
      flex: 1;
      min-width: 0;
      max-width: 920px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ---------- Header (no tagline) ---------- */
    .landing-header {
      text-align: center;
      margin-bottom: 2.5rem;
      width: 100%;
    }

    .date-badge {
      display: inline-block;
      background: #dc2626;
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: 0.45rem 1.4rem;
      border-radius: 40px;
      margin-bottom: 1rem;
      box-shadow: 0 6px 18px -6px rgba(220, 38, 38, 0.7);
    }

    .landing-header h1 {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .landing-header h1 span {
      background: #dc2626;
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 0.3rem 1rem;
      border-radius: 40px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* ---------- Match list ---------- */
    .matches-list {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      width: 100%;
    }

    /* ---------- Match card ---------- */
    .match-card {
      background: linear-gradient(135deg, #dc2626 0%, #b91c1c 60%, #991b1b 100%);
      border-radius: 1.4rem;
      padding: 1.1rem 1.6rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 30px -10px rgba(220, 38, 38, 0.45), 0 4px 12px -4px rgba(0, 0, 0, 0.6);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
      text-decoration: none;
    }

    .match-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 22px 44px -14px rgba(220, 38, 38, 0.6), 0 8px 18px -8px rgba(0, 0, 0, 0.7);
    }

    .team {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      flex: 1;
      min-width: 0;
    }

    .team.right {
      justify-content: flex-end;
      text-align: right;
    }

    .team-logo {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: contain;
      background: #ffffff;
      padding: 6px;
      flex-shrink: 0;
      box-shadow: 0 4px 10px -2px rgba(0, 0, 0, 0.4);
    }

    .team-name {
      font-weight: 700;
      font-size: 1.08rem;
      color: #ffffff;
      line-height: 1.25;
      word-break: break-word;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.25);
    }

    .vs-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1rem;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.35);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      flex-shrink: 0;
      letter-spacing: -0.5px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    .match-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.3rem;
      flex-shrink: 0;
      margin-left: 0.5rem;
      min-width: 110px;
      text-align: right;
    }

    .league-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #ffe4e6;
    }

    .league-row img {
      width: 18px;
      height: 18px;
      object-fit: contain;
      background: #ffffff;
      border-radius: 4px;
      padding: 2px;
    }

    .time-text {
      font-size: 0.78rem;
      font-weight: 600;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.3);
      padding: 0.2rem 0.55rem;
      border-radius: 20px;
      white-space: nowrap;
    }

    .date-text {
      font-size: 0.68rem;
      font-weight: 500;
      color: #fecaca;
      letter-spacing: 0.3px;
    }

    .watch-badge {
      display: inline-block;
      margin-top: 0.3rem;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.35);
      padding: 0.18rem 0.55rem;
      border-radius: 20px;
    }

    /* ============================================================
       RIGHT STICKY AD (300x250)
       ============================================================ */
    .ad-right {
      flex-shrink: 0;
      width: 300px;
      position: sticky;
      top: 1.5rem;
      align-self: flex-start;
      z-index: 5;
    }

    .ad-right .ad-box {
      width: 300px;
      height: 250px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 0.6rem;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ============================================================
       BOTTOM STICKY AD (728x90)
       ============================================================ */
    .ad-bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      background: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0.5rem 0;
      z-index: 100;
      border-top: 1px solid #1e293b;
      box-shadow: 0 -8px 24px -8px rgba(0, 0, 0, 0.8);
    }

    .ad-bottom .ad-box {
      width: 728px;
      max-width: 100%;
      height: 90px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 1300px) {
      .ad-left { display: none; }
    }

    @media (max-width: 1000px) {
      .ad-right { display: none; }
      .center-col { max-width: 100%; }
    }

    @media (max-width: 760px) {
      .match-meta { min-width: 90px; }
      .team-logo { width: 44px; height: 44px; padding: 5px; }
      .team-name { font-size: 0.98rem; }
    }

    @media (max-width: 600px) {
      body { padding: 1.5rem 0 7rem; }
      .page-wrap { padding: 0 0.75rem; gap: 0.75rem; }
      .match-card { padding: 0.9rem 1rem; gap: 0.5rem; border-radius: 1.1rem; }
      .team { gap: 0.55rem; }
      .team-logo { width: 38px; height: 38px; padding: 4px; }
      .team-name { font-size: 0.88rem; }
      .vs-divider { width: 38px; height: 38px; font-size: 0.8rem; }
      .match-meta { display: none; }
      .landing-header h1 { font-size: 1.8rem; }
    }

    @media (max-width: 380px) {
      .team-name { font-size: 0.8rem; }
      .team-logo { width: 32px; height: 32px; }
    }
  </style>
</head>

    // ---------- Render match cards ----------
    const container = document.getElementById('matchesList');

    function renderCards(matches) {
      container.innerHTML = '';
      matches.forEach(match => {
        const card = document.createElement('a');
        card.className = 'match-card';
        card.href = `watch.html?id=${encodeURIComponent(match.MatchID)}`;
        card.target = '_blank';
        card.rel = 'noopener noreferrer';

        const teamLeft = document.createElement('div');
        teamLeft.className = 'team';
        teamLeft.innerHTML = `
          <img class="team-logo" src="${match.Team1Logo}" alt="${match.Team1}" loading="lazy"
               onerror="this.src='https://www.espn.com/i/teamlogos/soccer/500/default-team-logo-500.png?h=100&w=100'">
          <span class="team-name">${match.Team1}</span>
        `;

        const vs = document.createElement('div');
        vs.className = 'vs-divider';
        vs.textContent = 'VS';

        const teamRight = document.createElement('div');
        teamRight.className = 'team right';
        teamRight.innerHTML = `
          <span class="team-name">${match.Team2}</span>
          <img class="team-logo" src="${match.Team2Logo}" alt="${match.Team2}" loading="lazy"
               onerror="this.src='https://www.espn.com/i/teamlogos/soccer/500/default-team-logo-500.png?h=100&w=100'">
        `;

        const meta = document.createElement('div');
        meta.className = 'match-meta';
        const dateObj = new Date(match.MatchDate + 'T00:00:00');
        const dateStr = dateObj.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
        meta.innerHTML = `
          <div class="league-row">
            <img src="${match.LeagueLogo}" alt="${match.League}" loading="lazy"
                 onerror="this.style.display='none'">
            <span>${match.League}</span>
          </div>
          <span class="time-text">${match.MatchStartTime} – ${match.MatchEndTime}</span>
          <span class="date-text">${dateStr}</span>
          <span class="watch-badge">Watch</span>
        `;

        card.appendChild(teamLeft);
        card.appendChild(vs);
        card.appendChild(teamRight);
        card.appendChild(meta);

        container.appendChild(card);
      });
    }

    renderCards(matchData);
