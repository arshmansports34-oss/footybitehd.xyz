<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch · Live Stream</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: #000000;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      color: #ffffff;
      padding: 1.5rem 0 7.5rem; /* bottom space for sticky 728x90 ad */
    }

    /* ============================================================
       3-COLUMN WRAP: left ad · center · right ad
       ============================================================ */
    .page-wrap {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 1.5rem;
      max-width: 1700px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    /* ============================================================
       LEFT STICKY AD (160x600)
       ============================================================ */
    .ad-left {
      flex-shrink: 0;
      width: 160px;
      position: sticky;
      top: 1.5rem;
      align-self: flex-start;
      z-index: 5;
    }

    .ad-left .ad-box {
      width: 160px;
      height: 600px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 0.6rem;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ============================================================
       RIGHT STICKY AD (300x250)
       ============================================================ */
    .ad-right {
      flex-shrink: 0;
      width: 300px;
      position: sticky;
      top: 1.5rem;
      align-self: flex-start;
      z-index: 5;
    }

    .ad-right .ad-box {
      width: 300px;
      height: 250px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 0.6rem;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ============================================================
       CENTER COLUMN
       ============================================================ */
    .center-col {
      flex: 1;
      min-width: 0;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
    }

    /* ---------- Top bar ---------- */
    .top-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      background: rgba(220, 38, 38, 0.85);
      padding: 0.55rem 1.1rem;
      border-radius: 40px;
      transition: background 0.2s ease, transform 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .back-link:hover {
      background: #dc2626;
      transform: translateY(-1px);
    }

    .back-link svg {
      width: 16px;
      height: 16px;
    }

    /* ---------- Match header ---------- */
    .match-header {
      width: 100%;
      background: linear-gradient(135deg, #dc2626 0%, #b91c1c 60%, #991b1b 100%);
      border-radius: 1.4rem;
      padding: 1.4rem 1.8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.2rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 30px -10px rgba(220, 38, 38, 0.5);
    }

    .team {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      flex: 1;
      min-width: 0;
    }

    .team.right {
      justify-content: flex-end;
      text-align: right;
    }

    .team-logo {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: contain;
      background: #ffffff;
      padding: 7px;
      flex-shrink: 0;
      box-shadow: 0 4px 10px -2px rgba(0, 0, 0, 0.4);
    }

    .team-name {
      font-weight: 800;
      font-size: 1.3rem;
      color: #ffffff;
      line-height: 1.25;
      word-break: break-word;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.25);
    }

    .vs-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.05rem;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.35);
      width: 54px;
      height: 54px;
      border-radius: 50%;
      flex-shrink: 0;
      letter-spacing: -0.5px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    /* ---------- Match info strip ---------- */
    .match-info {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin-bottom: 1.2rem;
      font-size: 0.9rem;
      color: #cbd5e1;
    }

    .info-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 0.5rem 1rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.85rem;
      color: #e2e8f0;
    }

    .info-chip img {
      width: 20px;
      height: 20px;
      object-fit: contain;
      background: #ffffff;
      border-radius: 4px;
      padding: 2px;
    }

    /* ---------- Stream container ---------- */
    .stream-wrapper {
      width: 100%;
      position: relative;
      background: #0f172a;
      border-radius: 1.2rem;
      overflow: hidden;
      border: 1px solid #1e293b;
      box-shadow: 0 20px 60px -20px rgba(220, 38, 38, 0.35), 0 8px 24px -8px rgba(0, 0, 0, 0.8);
      aspect-ratio: 16 / 9;
    }

    .stream-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* ---------- Loader / fallback ---------- */
    .loader {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background: #0f172a;
      color: #94a3b8;
      font-weight: 500;
      font-size: 0.95rem;
      z-index: 1;
      transition: opacity 0.4s ease;
    }

    .loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(220, 38, 38, 0.2);
      border-top-color: #dc2626;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-box {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      background: #0f172a;
      color: #fca5a5;
      text-align: center;
      padding: 2rem;
      z-index: 2;
    }

    .error-box.show { display: flex; }

    .error-box h3 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
    }

    .error-box p {
      font-size: 0.9rem;
      color: #94a3b8;
      max-width: 400px;
    }

    /* ============================================================
       BOTTOM STICKY AD (728x90)
       ============================================================ */
    .ad-bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      background: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0.5rem 0;
      z-index: 100;
      border-top: 1px solid #1e293b;
      box-shadow: 0 -8px 24px -8px rgba(0, 0, 0, 0.8);
    }

    .ad-bottom .ad-box {
      width: 728px;
      max-width: 100%;
      height: 90px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 1400px) {
      .ad-left { display: none; }
    }

    @media (max-width: 1100px) {
      .ad-right { display: none; }
      .center-col { max-width: 100%; }
    }

    @media (max-width: 700px) {
      body { padding: 1rem 0 7rem; }
      .page-wrap { padding: 0 0.75rem; gap: 0.75rem; }
      .match-header { padding: 1.1rem 1.2rem; }
      .team-logo { width: 46px; height: 46px; padding: 5px; }
      .team-name { font-size: 1rem; }
      .vs-divider { width: 44px; height: 44px; font-size: 0.9rem; }
      .match-info { gap: 0.75rem; }
      .info-chip { font-size: 0.78rem; padding: 0.4rem 0.8rem; }
    }

    @media (max-width: 480px) {
      .team-name { font-size: 0.85rem; }
      .team-logo { width: 38px; height: 38px; }
      .vs-divider { width: 38px; height: 38px; font-size: 0.8rem; }
    }
  </style>
</head>

      $('matchInfo').innerHTML = `
        <span class="info-chip">
          <img src="${match.LeagueLogo}" alt="${match.League}"
               onerror="this.style.display='none'">
          ${match.League}
        </span>
        <span class="info-chip">${dateStr}</span>
        <span class="info-chip">${match.MatchStartTime} – ${match.MatchEndTime}</span>
        <span class="info-chip">${match.Sport}</span>
      `;

      // ---------- Build iframe ----------
      const iframe = document.createElement('iframe');
      iframe.src = match.IframeURL;
      iframe.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
      iframe.allowFullscreen = true;
      iframe.referrerPolicy = 'no-referrer-when-downgrade';

      iframe.addEventListener('load', () => {
        $('loader').classList.add('hidden');
      });

      setTimeout(() => {
        if (!$('loader').classList.contains('hidden')) {
          $('loader').classList.add('hidden');
          $('errorBox').classList.add('show');
          $('errorMsg').textContent = 'The stream took too long to load. Please try again or pick another match.';
        }
      }, 15000);

      $('streamWrapper').appendChild(iframe);

      document.title = `${match.Team1} vs ${match.Team2} · Watch Live`;
    }
  </script>

</body>
</html>
